<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="settings-panel">
        <h2 class="panel-title">Settings</h2>
        <div class="settings-content">
            <div class="settings-item">
                <label>Game Mode</label>
                <select id="gameMode">
                    <option value="timer">Timer</option>
                    <option value="input">Input</option>
                </select>
            </div>
            <div class="settings-item">
                <label>Show Cooldown</label>
                <input type="checkbox" id="showCooldown" checked>
            </div>
            <div class="settings-item">
                <label>Max Cooldown (sec)</label>
                <input type="number" id="maxCooldown" value="30" min="1" max="300">
            </div>
            <div class="settings-item">
                <label>Number Input Threshold (sec)</label>
                <input type="number" id="numberInputThreshold" value="15" min="1" max="120">
            </div>
            <div class="settings-item">
                <label>Ability Haste</label>
                <input type="number" id="abilityHaste" value="0" min="0" max="500">
            </div>
        </div>
    </aside>
    <div class="page">
        <div class="app">
            <h1 class="title">LoLTimerGame</h1>
            <div class="ability-container">
                <img id="champion-portrait" src="" alt="Champion portrait" class="champion-portrait">
                <img id="picture" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23212a32'/%3E%3Cpath d='M40 120 L80 80 L110 110 L150 70 L160 80 L110 140 L80 110 L40 150 Z' fill='%23788ab2'/%3E%3Ctext x='50%25' y='180' dominant-baseline='middle' text-anchor='middle' font-family='Arial, sans-serif' font-size='18' fill='%2396a7b7'%3EPlaceholder%3C/text%3E%3C/svg%3E" alt="Placeholder image">
            </div>
            <p id="champion-ability">Champion ability description goes here.</p>
            <div id="ability-rank-dots" class="ability-rank-dots"></div>
            <p id="instruction">Click stop on 5 seconds</p>
            <div id="timer" class="timer">0.000</div>
            <div id="inputMode" class="input-mode" style="display: none;">
                <input type="number" id="cooldownInput" placeholder="Enter cooldown" step="0.1" min="0">
                <button id="submitCooldown" class="submit-btn">Submit</button>
            </div>
            <div id="feedback" class="feedback"></div>
            <button id="toggleButton">Start Timer</button>
        </div>
        <aside class="champion-panel">
            <h2 class="panel-title">Champions</h2>
            <div class="filter-section">
                <div class="filter-checkboxes">
                    <label class="filter-checkbox">
                        <input type="checkbox" data-role="top">
                        <span>Top</span>
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" data-role="jungle">
                        <span>Jungle</span>
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" data-role="mid">
                        <span>Mid</span>
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" data-role="adc">
                        <span>ADC</span>
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" data-role="support">
                        <span>Support</span>
                    </label>
                </div>
                <div class="filter-buttons">
                    <button id="resetFiltersBtn" class="reset-filters-btn">Reset</button>
                    <button id="grayAllBtn" class="reset-filters-btn">Remove all</button>
                </div>
            </div>
            <div id="champion-grid" class="champion-grid"></div>
        </aside>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
